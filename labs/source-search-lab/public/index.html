<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Source Search Lab</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page">
    <section class="search-box">
      <p class="eyebrow">PoryGen experiment</p>
      <h1>Source Search Lab</h1>
      <p class="intro">Searches 10 sources in this project first. Private mode is the default: your query stays on this server and is not cached or sent to a third party.</p>

      <form id="search-form">
        <label class="sr-only" for="query">Search</label>
        <div class="search-row">
          <input id="query" name="q" type="search" placeholder="Try: winnowing fingerprints" autocomplete="off" autocapitalize="off" spellcheck="false" required>
          <button type="submit">Search</button>
        </div>
        <label class="privacy-option">
          <input id="allow-web" type="checkbox">
          Public demo only: allow web fallback if no local match. This sends the query to the configured search provider.
        </label>
      </form>

      <p id="status" class="status" aria-live="polite">Private mode ready.</p>
    </section>

    <section id="results" class="results" aria-label="Search results"></section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
