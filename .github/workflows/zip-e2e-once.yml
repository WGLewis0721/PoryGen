name: ZIP E2E once
on:
  push:
    branches: [feature/zip-scan-ui]
    paths: ['.github/workflows/zip-e2e-once.yml']

permissions:
  contents: read

jobs:
  zip-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run exactly one real ZIP HTTP scan
        run: node --test --test-name-pattern="real HTTP ZIP request reaches the production handler and existing engine" scripts/test-zip-ingestion.mjs
