name: Post-merge production smoke

on:
  push:
    branches:
      - test/post-merge-smoke-a80a94c
    paths:
      - .github/workflows/post-merge-smoke-a80a94c.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scan Apex, zero-file, and partial repos
        env:
          SCAN_ENDPOINT: https://porygen.vercel.app/api/scan
        run: |
          node --input-type=module <<'NODE'
          const cases = [
            { repo: "apex", kind: "uuid" },
            { repo: "K8s-Ai-WGL", kind: "zero" },
            { repo: "PoryGen", kind: "partial" },
          ];

          async function scan(repo) {
            const response = await fetch(process.env.SCAN_ENDPOINT, {
              method: "POST",
              headers: { "content-type": "application/json", "user-agent": "PoryGen-PostMerge-Smoke/1.0" },
              body: JSON.stringify({
                sourceType: "github",
                repositoryUrl: `https://github.com/WGLewis0721/${repo}`,
                exclusions: [],
                termsVersion: "2026-09-22-v1",
                termsAcceptedAt: new Date().toISOString(),
              }),
              signal: AbortSignal.timeout(60000),
            });
            const payload = await response.json();
            return { response, payload };
          }

          let failures = 0;
          for (const c of cases) {
            const { response, payload } = await scan(c.repo);
            const strong = Array.isArray(payload.findings)
              ? payload.findings.filter((f) => f.classification === "strong_match")
              : [];
            const uuidStrong = strong.filter((f) => f.publicSource?.repository === "uuid@14.0.2");
            const out = {
              repo: c.repo,
              status: response.status,
              fetchedFiles: payload.scan?.fetchedFiles ?? null,
              partial: payload.scan?.partial ?? null,
              incompleteSupportedFiles: payload.scan?.incompleteSupportedFiles ?? null,
              strong: payload.summary?.strong ?? null,
              uuidStrong: uuidStrong.length,
            };

            let pass = response.ok;
            if (c.kind === "uuid") pass &&= uuidStrong.length === 0;
            if (c.kind === "zero") pass &&= payload.scan?.fetchedFiles === 0;
            if (c.kind === "partial") pass &&= payload.scan?.partial === true && (payload.scan?.incompleteSupportedFiles ?? 0) > 0;
            out.pass = pass;
            if (!pass) failures += 1;
            console.log("PORYGEN_SMOKE " + JSON.stringify(out));
          }

          console.log("PORYGEN_SMOKE_TOTAL " + JSON.stringify({ total: cases.length, failures }));
          if (failures) process.exit(1);
          NODE
